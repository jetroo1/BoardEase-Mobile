<meta charset="utf-8">
<title>BoardEase — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:390px;height:844px;overflow:hidden;background:#04212F;}
  body{
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ---------- Photographic ground ---------- */
  .ground{position:absolute;inset:0;overflow:hidden;}
  .ground img{width:100%;height:100%;object-fit:cover;}
  .ground::after{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(4,33,47,.30) 0%, rgba(4,33,47,.10) 26%, rgba(4,33,47,.52) 62%, rgba(4,33,47,.80) 100%);
  }

  /* film grain over everything glassy */
  .grain{
    position:absolute;inset:0;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  /* ---------- Status bar ---------- */
  .status{
    position:absolute;top:0;left:0;right:0;height:52px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;color:#fff;font-size:13px;font-weight:600;z-index:5;
    letter-spacing:.01em;
  }
  .status .icons{display:flex;gap:6px;align-items:center;opacity:.95;}

  /* ---------- Wordmark chip ---------- */
  .brandchip{
    position:absolute;top:64px;left:20px;z-index:4;
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 15px 9px 13px;border-radius:999px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid rgba(255,255,255,.22);
    border-top:1px solid rgba(255,255,255,.55);
    box-shadow:0 8px 32px rgba(4,33,47,.18);
  }
  .brandchip .mark{
    width:20px;height:20px;border-radius:6px;
    background:linear-gradient(145deg,#22D3EE,#0891B2);
    display:grid;place-items:center;
  }
  .brandchip .mark svg{width:12px;height:12px;}
  .brandchip b{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:16px;font-weight:700;color:#04212F;letter-spacing:-.02em;
  }

  /* ---------- Main glass pane ---------- */
  .pane{
    position:absolute;left:16px;right:16px;bottom:24px;z-index:4;
    padding:22px 20px 20px;
    border-radius:28px;
    background:rgba(255,255,255,.74);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(255,255,255,.24);
    border-top:1px solid rgba(255,255,255,.58);
    box-shadow:0 8px 40px rgba(4,33,47,.22);
    overflow:hidden;
  }
  .pane .grain{border-radius:28px;}

  .locpill{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px 6px 9px;border-radius:999px;
    background:rgba(52,211,153,.17);
    border:1px solid rgba(52,211,153,.30);
  }
  .locpill svg{width:13px;height:13px;}
  .locpill span{
    font-size:10.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:#0B7A5A;
  }

  h1{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.028em;
    color:#04212F;margin-top:16px;
  }
  .sub{
    font-size:14.5px;line-height:1.5;color:#54697A;margin-top:11px;
    max-width:31ch;
  }

  /* stats */
  .stats{
    display:flex;margin-top:20px;
    border-top:1px solid rgba(4,33,47,.10);
    border-bottom:1px solid rgba(4,33,47,.10);
  }
  .stat{flex:1;padding:14px 0 13px;position:relative;}
  .stat + .stat{border-left:1px solid rgba(4,33,47,.10);padding-left:14px;}
  .stat b{
    display:block;
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:21px;font-weight:700;color:#04212F;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  }
  .stat span{
    display:block;margin-top:3px;
    font-size:10px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:#7A8C9A;
  }

  /* buttons */
  .btn-coral{
    display:flex;align-items:center;justify-content:center;gap:9px;
    height:54px;margin-top:20px;border-radius:14px;
    background:#FF6B4A;
    box-shadow:0 6px 20px rgba(255,107,74,.34);
  }
  .btn-coral span{color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;}
  .btn-coral svg{width:18px;height:18px;}

  .link{
    display:block;text-align:center;margin-top:14px;
    font-size:14.5px;font-weight:600;color:#0E7490;
  }

  /* home indicator */
  .home-ind{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:134px;height:5px;border-radius:999px;background:rgba(255,255,255,.55);z-index:6;
  }
</style>

<div class="ground">
  <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" width="390" height="844">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0B3B52"/>
        <stop offset="26%"  stop-color="#1D6A7E"/>
        <stop offset="48%"  stop-color="#E9944F"/>
        <stop offset="62%"  stop-color="#F0B268"/>
        <stop offset="78%"  stop-color="#C87A52"/>
        <stop offset="100%" stop-color="#3E3038"/>
      </linearGradient>
      <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#2A4C5C"/>
        <stop offset="100%" stop-color="#12303F"/>
      </linearGradient>
      <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#1E3F4F"/>
        <stop offset="100%" stop-color="#0D2836"/>
      </linearGradient>
      <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%"   stop-color="#FFD9A0" stop-opacity=".95"/>
        <stop offset="55%"  stop-color="#FFB06A" stop-opacity=".35"/>
        <stop offset="100%" stop-color="#FFB06A" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="390" height="844" fill="url(#sky)"/>

    <!-- whole scene raised so the house reads above the glass pane -->
    <g transform="translate(0,-168)">

    <!-- sun -->
    <circle cx="268" cy="366" r="130" fill="url(#sunglow)"/>
    <circle cx="268" cy="366" r="27" fill="#FFE0B0" opacity=".92"/>

    <!-- distant ridge -->
    <path d="M0 430 L54 410 L108 424 L166 398 L228 418 L296 402 L390 424 L390 470 L0 470 Z"
          fill="#123243" opacity=".7"/>

    <!-- neighbour block, left -->
    <rect x="-6" y="404" width="96" height="200" fill="url(#bldg2)"/>
    <g fill="#FFC98A" opacity=".55">
      <rect x="10" y="426" width="15" height="19" rx="1.5"/>
      <rect x="38" y="426" width="15" height="19" rx="1.5"/>
      <rect x="66" y="426" width="15" height="19" rx="1.5"/>
      <rect x="10" y="470" width="15" height="19" rx="1.5"/>
      <rect x="66" y="470" width="15" height="19" rx="1.5"/>
    </g>

    <!-- main boarding house -->
    <rect x="96" y="352" width="196" height="252" fill="url(#bldg)"/>
    <!-- roof lip -->
    <rect x="88" y="344" width="212" height="12" rx="2" fill="#37606F"/>
    <!-- floor divider -->
    <rect x="96" y="470" width="196" height="4" fill="#0B2634" opacity=".75"/>

    <!-- upper windows, lit -->
    <g>
      <rect x="116" y="382" width="42" height="52" rx="2" fill="#FFCB8C" opacity=".88"/>
      <rect x="174" y="382" width="42" height="52" rx="2" fill="#FFCB8C" opacity=".72"/>
      <rect x="232" y="382" width="42" height="52" rx="2" fill="#FFCB8C" opacity=".85"/>
      <!-- grilles -->
      <g stroke="#123243" stroke-width="2.2" opacity=".85">
        <path d="M137 382v52M116 408h42"/>
        <path d="M195 382v52M174 408h42"/>
        <path d="M253 382v52M232 408h42"/>
      </g>
    </g>

    <!-- lower windows -->
    <g>
      <rect x="116" y="496" width="42" height="48" rx="2" fill="#FFCB8C" opacity=".55"/>
      <rect x="232" y="496" width="42" height="48" rx="2" fill="#FFCB8C" opacity=".78"/>
      <g stroke="#123243" stroke-width="2.2" opacity=".85">
        <path d="M137 496v48M116 520h42"/>
        <path d="M253 496v48M232 520h42"/>
      </g>
    </g>

    <!-- doorway + warm spill -->
    <rect x="178" y="500" width="34" height="104" rx="3" fill="#FFD9A6" opacity=".9"/>
    <rect x="186" y="512" width="18" height="92" fill="#8A4F2E" opacity=".35"/>

    <!-- tarpaulin sign -->
    <g transform="rotate(-2 214 452)">
      <rect x="176" y="444" width="76" height="26" rx="2" fill="#F6F1E4"/>
      <rect x="176" y="444" width="76" height="26" rx="2" fill="none" stroke="#C9BFA8" stroke-width="1"/>
      <rect x="183" y="451" width="62" height="3.4" rx="1.7" fill="#B0442B"/>
      <rect x="183" y="458" width="46" height="3" rx="1.5" fill="#2B4250" opacity=".75"/>
      <rect x="183" y="463" width="34" height="3" rx="1.5" fill="#2B4250" opacity=".55"/>
    </g>

    <!-- neighbour block, right -->
    <rect x="298" y="424" width="98" height="180" fill="url(#bldg2)"/>
    <g fill="#FFC98A" opacity=".5">
      <rect x="312" y="446" width="14" height="18" rx="1.5"/>
      <rect x="340" y="446" width="14" height="18" rx="1.5"/>
      <rect x="368" y="446" width="14" height="18" rx="1.5"/>
      <rect x="340" y="486" width="14" height="18" rx="1.5"/>
    </g>

    <!-- fence line -->
    <g stroke="#0C2836" stroke-width="3" opacity=".8">
      <path d="M0 604h390"/>
    </g>
    <g stroke="#143A4B" stroke-width="2.4" opacity=".85">
      <path d="M104 604v-28M124 604v-28M144 604v-28M164 604v-28M244 604v-28M264 604v-28M284 604v-28"/>
    </g>

    <!-- road -->
    <rect x="0" y="604" width="390" height="240" fill="#27333B"/>
    <rect x="0" y="604" width="390" height="10" fill="#33424B"/>
    <g fill="#8D9AA2" opacity=".35">
      <rect x="24"  y="690" width="44" height="5" rx="2.5"/>
      <rect x="104" y="690" width="44" height="5" rx="2.5"/>
      <rect x="184" y="690" width="44" height="5" rx="2.5"/>
      <rect x="264" y="690" width="44" height="5" rx="2.5"/>
      <rect x="344" y="690" width="44" height="5" rx="2.5"/>
    </g>

    <!-- palm fronds, framing -->
    <g fill="#0A2532" opacity=".92">
      <path d="M-10 250c46 6 78 30 96 62-34-20-62-28-96-26z"/>
      <path d="M-10 286c44 12 72 40 86 74-30-26-56-40-86-42z"/>
      <path d="M-10 214c40 0 74 16 98 42-32-14-62-20-98-18z"/>
      <path d="M400 176c-44 10-72 36-86 70 30-24 56-36 86-38z"/>
      <path d="M400 212c-40 16-64 44-74 78 26-28 48-44 74-48z"/>
    </g>

    </g><!-- /raised scene -->

    <!-- road extended to the bottom edge after the shift -->
    <rect x="0" y="436" width="390" height="408" fill="#27333B"/>
    <g fill="#8D9AA2" opacity=".28">
      <rect x="24"  y="530" width="44" height="5" rx="2.5"/>
      <rect x="104" y="530" width="44" height="5" rx="2.5"/>
      <rect x="184" y="530" width="44" height="5" rx="2.5"/>
      <rect x="264" y="530" width="44" height="5" rx="2.5"/>
      <rect x="344" y="530" width="44" height="5" rx="2.5"/>
    </g>
  </svg>
</div>
<div class="grain"></div>

<div class="status">
  <span>9:41</span>
  <span class="icons">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="#fff"><path d="M2 17h3v4H2zm5-4h3v8H7zm5-4h3v12h-3zm5-5h3v17h-3z"/></svg>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="#fff"><path d="M12 21l3.5-4.3a5.5 5.5 0 00-7 0L12 21zm7.3-8.9l1.8-2.2a13 13 0 00-18.2 0l1.8 2.2a10.2 10.2 0 0114.6 0z"/></svg>
    <svg viewBox="0 0 26 24" width="17" height="15" fill="#fff"><rect x="1" y="7" width="19" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.6" opacity=".6"/><rect x="3" y="9" width="14" height="6" rx="1.5"/><path d="M22 11v2" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".6"/></svg>
  </span>
</div>

<div class="brandchip">
  <span class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10l9-7 9 7v10a1 1 0 01-1 1H4a1 1 0 01-1-1z"/>
    </svg>
  </span>
  <b>BoardEase</b>
</div>

<div class="pane">
  <div class="grain"></div>

  <div class="locpill">
    <svg viewBox="0 0 24 24" fill="none" stroke="#0B7A5A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="3"/>
    </svg>
    <span>Tagum City</span>
  </div>

  <h1>Find a room near campus.<br>Not across town.</h1>

  <p class="sub">Compare price, distance and amenities for boarding houses around UM&nbsp;Tagum — then get walking directions.</p>

  <div class="stats">
    <div class="stat"><b>18</b><span>Listings</span></div>
    <div class="stat"><b>2 km</b><span>Radius</span></div>
    <div class="stat"><b>₱1.8k</b><span>From</span></div>
  </div>

  <div class="btn-coral">
    <span>Find rooms near me</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>

</div>
