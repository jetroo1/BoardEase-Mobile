<text x="444" y="713.36" font-size="12" fill="#0D1B26" text-anchor="start" font-weight="bold">Note for the panel: this is NoSQL, not a relational database</text>
<text x="444" y="728.72" font-size="12" fill="#55697A" text-anchor="start">Firestore stores collections of documents, so there are no foreign keys enforced by the</text>
<text x="444" y="744.08" font-size="12" fill="#55697A" text-anchor="start">database. The PK/FK labels above describe how the app</text>
<text x="444" y="759.44" font-size="12" fill="#55697A" text-anchor="start">treats these id fields; the joins happen in JavaScript. One rule is enforced in code rather</text>
<text x="444" y="774.8000000000001" font-size="12" fill="#55697A" text-anchor="start">than by the database: one review per user per property.</text>
